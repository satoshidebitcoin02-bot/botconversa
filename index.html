<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>chat companion — online agora</title>
<link rel="stylesheet" href="styles.css?v=4" />
</head>

<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

<symbol id="i-user-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21H4a2 2 0 0 1-2-2v-1a5 5 0 0 1 5-5h2"/><circle cx="9" cy="7" r="4"/><circle cx="17" cy="17" r="5"/><polyline points="17 15 17 17 18.5 18"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
<symbol id="i-message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>

<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></symbol>
</defs>
</svg>
<div class="phone">
  <div class="topbar">
    <h1 id="logoSlot">chats</h1>
  </div>

  <div class="disclosure-banner">
    <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-alert-triangle"></use></svg>
    Essas garotas abaixo estão a procura de um companheiro para conversar.
  </div>

  <div class="stories" id="stories" hidden></div>

<div class="convo-scroll" id="convoScroll" hidden>
    <div id="convoList"></div>
    <div class="paywall-banner">
      <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-lock"></use></svg>
      Libere mais chats por apenas <strong>R$5,99</strong>
    </div>
  </div>
</div>

<div id="adGate" class="ad-gate-overlay" hidden>
  <div class="ad-gate-box">
    <div class="ad-gate-label">Anúncio</div>
    <div id="adGateContent" class="ad-gate-content"></div>
    <div class="ad-gate-footer">
      <p id="adGateWaitText" class="ad-gate-wait-text" hidden></p>
      <span id="adGateTimer" class="ad-gate-timer"></span>
      <button id="adGateBtn" class="ad-gate-btn" hidden>Ir para o chat →</button>
    </div>
  </div>
</div>

<script src="data.js?v=4"></script>
<script src="config-store.js?v=4"></script>
<script src="viewport-fix.js?v=4"></script>
<script src="script.js?v=4"></script>
</body>
</html>
