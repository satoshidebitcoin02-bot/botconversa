<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel Admin — BOT Companion</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
<svg style="display:none" aria-hidden="true">
<defs>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
<symbol id="i-user-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21H4a2 2 0 0 1-2-2v-1a5 5 0 0 1 5-5h2"/><circle cx="9" cy="7" r="4"/><circle cx="17" cy="17" r="5"/><polyline points="17 15 17 17 18.5 18"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
<symbol id="i-message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="i-shopping-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
<symbol id="i-megaphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v3a1 1 0 0 0 1 1h2l3 6h2l-1-6h4l6 4V5l-6 4H5a1 1 0 0 0-1 1z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></symbol>
</defs>
</svg>

<div class="admin-shell">
  <nav class="admin-sidebar">
    <div class="admin-sidebar-title">Painel Admin</div>
    <button type="button" class="admin-tab-btn active" data-tab="appearance"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-settings"></use></svg> Aparência</button>
    <button type="button" class="admin-tab-btn" data-tab="personas"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-users"></use></svg> Personagens</button>
    <button type="button" class="admin-tab-btn" data-tab="flows"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-shuffle"></use></svg> Fluxos</button>
  </nav>

  <main class="admin-main">

    <section id="tab-appearance" class="admin-tab-panel">
      <section class="admin-card">
        <h2>Logo do app</h2>
        <div class="admin-row">
          <label><input type="radio" name="logoType" value="text" checked /> Texto</label>
          <label><input type="radio" name="logoType" value="image" /> Imagem</label>
        </div>
        <input id="logoTextInput" type="text" placeholder="Texto do logo (ex: chats)" />
        <div id="logoImageGroup" hidden>
          <input id="logoImageInput" type="hidden" />
          <label class="admin-upload-btn">
            <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-folder"></use></svg> Enviar arquivo
            <input id="logoImageFile" type="file" accept="image/*" hidden />
          </label>
        </div>
      </section>

      <section class="admin-card">
        <h2>Fundo da conversa</h2>
        <input id="backgroundInput" type="hidden" />
        <label class="admin-upload-btn">
          <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-folder"></use></svg> Enviar arquivo
          <input id="backgroundFile" type="file" accept="image/*" hidden />
        </label>
        <div id="backgroundPreview" class="admin-bg-preview"></div>
      </section>

      <section class="admin-card">
        <h2>Sons</h2>
        <label class="admin-row">
          <input id="soundsToggle" type="checkbox" checked />
          Ativar som ao enviar/receber mensagens
        </label>
      </section>

      <div class="admin-save-bar">
        <div id="saveStatus" class="admin-status"></div>
        <button id="saveBtn" class="admin-primary-btn">Salvar alterações</button>
      </div>
    </section>

    <section id="tab-personas" class="admin-tab-panel" hidden>
      <section class="admin-card">
        <div class="admin-card-header">
          <h2>Personagens</h2>
          <button type="button" id="addPersonaBtn" class="admin-primary-btn">+ Adicionar personagem</button>
        </div>
        <div id="personaList" class="admin-persona-list"></div>
      </section>

      <div class="admin-save-bar">
        <div id="saveStatusPersonas" class="admin-status"></div>
        <button id="saveBtnPersonas" class="admin-primary-btn">Salvar alterações</button>
      </div>
    </section>

    <section id="tab-flows" class="admin-tab-panel" hidden>

      <div id="flowsListView">
        <div class="flows-list-header">
          <h2>Fluxos</h2>
          <button type="button" id="newFlowBtnList" class="admin-primary-btn">+ Novo fluxo</button>
        </div>
        <div id="flowsList" class="flows-grid"></div>
      </div>

      <div id="flowEditorWrap" class="flow-editor-wrap" hidden>
        <div class="flow-toolbar">
          <div class="flow-toolbar-row">
            <input id="flowNameInput" type="text" class="flow-name-input" placeholder="Nome do fluxo" />
            <div class="flow-toolbar-actions">
              <button type="button" id="newFlowBtnEditor" class="admin-secondary-btn">+ Novo fluxo</button>
              <button type="button" id="saveFlowBtn" class="admin-primary-btn">Salvar fluxo</button>
              <button type="button" id="deleteFlowBtn" class="admin-secondary-btn">Excluir</button>
              <button type="button" id="closeFlowEditorBtn" class="admin-secondary-btn">Voltar</button>
            </div>
          </div>
          <div class="flow-toolbar-row">
            <div id="flowPersonaAssign" class="flow-persona-assign"></div>
          </div>
        </div>
        <div id="flowSaveStatus" class="admin-status"></div>

        <div class="flow-editor-body">
          <aside class="node-palette">
            <h3>Controle</h3>
            <div class="palette-item" draggable="true" data-node="delay"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-clock"></use></svg> Delay</div>
            <div class="palette-item" draggable="true" data-node="randomizer"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-shuffle"></use></svg> Randomizer</div>
            <div class="palette-item" draggable="true" data-node="wait"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-user-clock"></use></svg> Aguardar Resposta</div>
            <h3>Envio de itens</h3>
            <div class="palette-item" draggable="true" data-node="audio"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-mic"></use></svg> Áudio</div>
            <div class="palette-item" draggable="true" data-node="contact"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-user"></use></svg> Contato</div>
            <div class="palette-item" draggable="true" data-node="document"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-file-text"></use></svg> Documento</div>
            <div class="palette-item" draggable="true" data-node="media"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-image"></use></svg> Mídia</div>
            <div class="palette-item" draggable="true" data-node="text"><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-message"></use></svg> Texto</div>
          </aside>
          <div id="drawflowCanvas" class="drawflow-canvas"></div>
        </div>
      </div>

    </section>

  </main>
</div>

<script src="data.js"></script>
<script src="config-store.js"></script>
<script src="icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.js"></script>
<script src="flow-editor.js"></script>
<script src="admin.js"></script>
</body>
</html>
